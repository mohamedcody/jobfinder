server.port=8080
server.forward-headers-strategy=framework

# ==========================================
# 1. إعدادات قاعدة البيانات والتطوير (المتغيرات متوافقة مع جهازك)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#Flyway Migration Settings
spring.flyway.repair-on-migrate=true

# Hikari Connection Pool Settings
# NOTE: prepareThreshold=0 and preferQueryMode=simple were removed.
# They force the JDBC driver into text-only mode, which prevents PGobject (used by pgvector)
# from being sent via the extended binary protocol, causing 'cannot cast bytea to vector'.
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Activates hibernate-vector's VectorJdbcType contributor (float[] <-> vector(768))
spring.jpa.properties.hibernate.type.vector_enabled=true

# Hibernate Batch Insert Optimization (for CV parsing skills, education, experience)
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ⚠️ الأمان للإنتاج: غيرها لـ validate عند الرفع النهائي للسيرفر
spring.jpa.hibernate.ddl-auto=validate

# ==========================================
# 2. إغلاق الثغرات وأدوات التطوير (حل مشاكل الـ Audit)
# ==========================================
# تعطيل أدوات GraphQL في الإنتاج (لو محتاجها حالياً local خليها true)
spring.graphql.graphiql.enabled=false
spring.graphql.schema.printer.enabled=false

# ==========================================
# 3. إعدادات الخدمات الخارجية (Apify & Gemini)
# ==========================================
apify.token=${MY_APIFY_TOKEN}
apify.api.actor-url=https://api.apify.com/v2/acts/curious_coder~linkedin-jobs-scraper/runs
apify.api.status-url=https://api.apify.com/v2/actor-runs/
apify.api.dataset-url=https://api.apify.com/v2/datasets/

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}

# Security / JWT
jwt.secret=${MY_SECRET_KEY}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# ==========================================
# 4. إعدادات ميل السيرفر (Mail Configuration)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# 5. مراقبة حالة التطبيق (Spring Boot Actuator)
# ==========================================
management.endpoint.health.show-details=never

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:WARN}

# Production hardening
server.error.include-stacktrace=never
server.error.include-message=never
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:200}
server.tomcat.connection-timeout=${SERVER_TOMCAT_CONNECTION_TIMEOUT:5s}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=read_only

# ==========================================
# 6. Resilience4j Circuit Breaker Configuration
# ==========================================
resilience4j.circuitbreaker.instances.apifyApi.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.apifyApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.apifyApi.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.apifyApi.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.apifyApi.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.apifyApi.waitDurationInOpenState=60s
resilience4j.circuitbreaker.instances.apifyApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.apifyApi.eventConsumerBufferSize=10

resilience4j.circuitbreaker.instances.geminiApi.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.geminiApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.geminiApi.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.geminiApi.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.geminiApi.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.geminiApi.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.geminiApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.geminiApi.eventConsumerBufferSize=10

# CV Parsing: Gemini Circuit Breaker (separate instance for isolation)
resilience4j.circuitbreaker.instances.geminiCvApi.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.geminiCvApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.geminiCvApi.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.geminiCvApi.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.geminiCvApi.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.geminiCvApi.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.geminiCvApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.geminiCvApi.eventConsumerBufferSize=10

# CV Parsing: Retry Configuration (exponential backoff for transient 5xx/rate-limit errors)
resilience4j.retry.instances.cvAiExtraction.maxAttempts=3
resilience4j.retry.instances.cvAiExtraction.waitDuration=2s
resilience4j.retry.instances.cvAiExtraction.enableExponentialBackoff=true
resilience4j.retry.instances.cvAiExtraction.exponentialBackoffMultiplier=2
resilience4j.retry.instances.cvAiExtraction.retryExceptions=org.springframework.web.reactive.function.client.WebClientResponseException$ServiceUnavailable,org.springframework.web.reactive.function.client.WebClientResponseException$TooManyRequests,org.springframework.web.reactive.function.client.WebClientResponseException$GatewayTimeout,java.util.concurrent.TimeoutException
resilience4j.retry.instances.cvAiExtraction.ignoreExceptions=jobfinder.exception.MalformedAiResponseException,jobfinder.exception.CvExtractionException

# ==========================================
# 7. File Upload Configuration (CV Parsing)
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
