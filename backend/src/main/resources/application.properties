server.port=8080
server.forward-headers-strategy=framework

# ==========================================
# 1. إعدادات قاعدة البيانات والتطوير (المتغيرات متوافقة مع جهازك)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#Flyway Migration Settings
spring.flyway.repair-on-migrate=true

# Hikari Connection Pool Settings
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ⚠️ الأمان للإنتاج: غيرها لـ validate عند الرفع النهائي للسيرفر
spring.jpa.hibernate.ddl-auto=validate

# ==========================================
# 2. إغلاق الثغرات وأدوات التطوير (حل مشاكل الـ Audit)
# ==========================================
# تعطيل أدوات GraphQL في الإنتاج (لو محتاجها حالياً local خليها true)
spring.graphql.graphiql.enabled=false
spring.graphql.schema.printer.enabled=false

# ==========================================
# 3. إعدادات الخدمات الخارجية (Apify & Gemini)
# ==========================================
apify.token=${MY_APIFY_TOKEN}
apify.api.actor-url=https://api.apify.com/v2/acts/curious_coder~linkedin-jobs-scraper/runs
apify.api.status-url=https://api.apify.com/v2/actor-runs/
apify.api.dataset-url=https://api.apify.com/v2/datasets/

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}

# Security / JWT
jwt.secret=${MY_SECRET_KEY}
jwt.expiration=${MY_EXPIRATION_TIME}

# ==========================================
# 4. إعدادات ميل السيرفر (Mail Configuration)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# 5. مراقبة حالة التطبيق (Spring Boot Actuator)
# ==========================================
management.endpoint.health.show-details=never

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:WARN}

# Production hardening
server.error.include-stacktrace=never
server.error.include-message=never
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:200}
server.tomcat.connection-timeout=${SERVER_TOMCAT_CONNECTION_TIMEOUT:5s}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=read_only

# ==========================================
# 6. Resilience4j Circuit Breaker Configuration
# ==========================================
resilience4j.circuitbreaker.instances.apifyApi.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.apifyApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.apifyApi.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.apifyApi.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.apifyApi.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.apifyApi.waitDurationInOpenState=60s
resilience4j.circuitbreaker.instances.apifyApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.apifyApi.eventConsumerBufferSize=10

resilience4j.circuitbreaker.instances.geminiApi.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.geminiApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.geminiApi.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.geminiApi.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.geminiApi.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.geminiApi.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.geminiApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.geminiApi.eventConsumerBufferSize=10
