services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # هنا الدوكر هيقرأ القيم مباشرة من ملف الـ .env بتاعك
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MY_SECRET_KEY: ${MY_SECRET_KEY}
      MY_EXPIRATION_TIME: ${MY_EXPIRATION_TIME}
      MY_APIFY_TOKEN: ${MY_APIFY_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 10

  frontend:
    build: .
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_AUTH_API_URL: /api/auth
      NEXT_PUBLIC_JOBS_API_URL: /api/jobs
      NEXT_PUBLIC_SAVED_JOBS_API_URL: /api/saved-jobs

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on: [frontend, backend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro

  prometheus:
    image: prom/prometheus:v3.8.1
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"

volumes:
  prometheus_data:
  grafana_data: